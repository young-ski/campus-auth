name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: py${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: pytest -q

  keyring:
    name: 钥匙串依赖可装可跑
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev,keyring]"
      - name: keyring 能 import、凭据逻辑能过
        run: |
          python -c "import keyring; print(keyring.get_keyring())"
          pytest -q tests/test_credentials.py

  smoke:
    name: 打包与入口自检
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: 帮助与适配层列表可运行
        run: |
          campus-auth --help
          campus-auth adapters
          campus-auth init -o /tmp/x.toml
          grep -q 'adapter = "huuc"' /tmp/x.toml
          sed -i 's/^account = ""/account = "0814"/' /tmp/x.toml
      - name: 单文件 zipapp 可构建、可运行（与发布同一脚本）
        run: |
          python tools/build_zipapp.py /tmp/campus-auth.pyz
          python /tmp/campus-auth.pyz adapters
      - name: zipapp 要能被 python -m 和退出码契约正常对待
        run: |
          python /tmp/campus-auth.pyz probe --url nonsense && exit 1 || test $? -eq 2
      - name: 发给同学的压缩包能构建、清单齐全
        run: |
          python tools/make_bundle.py /tmp/bundle/
          python - "$(ls /tmp/bundle/*.zip)" <<'PY'
          import sys, zipfile
          names = sorted(n.rsplit("/", 1)[-1] for n in zipfile.ZipFile(sys.argv[1]).namelist())
          assert names == ["SHA256SUMS", "campus-auth.pyz", "disclaimer.txt",
                           "install-guide.txt", "install.cmd"], names
          print("bundle ok:", names)
          PY
      - name: 版本一致性
        run: python tools/check_version.py
      - name: install 产物的转义自检
        run: python tools/check_install_artifacts.py
      - name: install --dry-run 能给出产物
        run: |
          campus-auth install --config /tmp/x.toml --dry-run | tee /tmp/dry.txt
          grep -q 'campus_auth' /tmp/dry.txt

  install:
    # 三平台的 install 命令以前只跑过 dry-run 的字符串检查，真机从没执行过
    name: 自启能装能卸 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: 造一份配置
        shell: bash
        run: |
          printf 'adapter = "huuc"\naccount = "0814"\npassword = "pw"\n' > "$RUNNER_TEMP/c.toml"
      - name: install --dry-run 先给产物
        shell: bash
        run: campus-auth install --config "$RUNNER_TEMP/c.toml" --dry-run | grep -q campus_auth
      - name: 真装
        shell: bash
        run: campus-auth install --config "$RUNNER_TEMP/c.toml"
      # 核实用各自的原生 shell：bash 在 Windows 上会把 `/v` 当路径改写，
      # $APPDATA 里的反斜杠也不是 bash 的路径分隔符
      - name: 装上了吗（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $run = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'
          if (-not (Get-ItemProperty -Path $run -Name campus-auth-watch).'campus-auth-watch') {
            throw 'Run 键里没有登记'
          }
          $shim = Join-Path $env:APPDATA 'campus-auth\campus-auth-watch.cmd'
          if (-not (Test-Path $shim)) { throw "shim 不在: $shim" }
          if (-not (Select-String -Path $shim -Pattern ':loop' -Quiet)) { throw 'shim 里没有重启循环' }
      - name: 装上了吗（macOS）
        if: runner.os == 'macOS'
        shell: bash
        run: |
          launchctl list | grep campus-auth
          test -f "$HOME/Library/LaunchAgents/cn.campus-auth.watch.plist"
      - name: 卸载
        shell: bash
        run: campus-auth uninstall --config "$RUNNER_TEMP/c.toml"
      - name: 卸载后要干净（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $run = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'
          if ((Get-ItemProperty -Path $run -Name campus-auth-watch -ErrorAction SilentlyContinue)) {
            throw 'Run 键没删掉'
          }
          if (Test-Path (Join-Path $env:APPDATA 'campus-auth\campus-auth-watch.cmd')) {
            throw 'shim 没删掉'
          }
      - name: 卸载后要干净（macOS）
        if: runner.os == 'macOS'
        shell: bash
        run: test ! -f "$HOME/Library/LaunchAgents/cn.campus-auth.watch.plist"

  bundle:
    # install.cmd 是同学双击的第一个东西：在这台真 Windows 上验一遍它的管道
    name: 发给同学的包能跑起来
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python tools/make_bundle.py bundle/
      - name: 解压后按同学的路径跑
        shell: pwsh
        run: |
          $zip = Get-ChildItem bundle/*.zip | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath x
          $dir = Get-ChildItem x -Directory | Select-Object -First 1
          Push-Location $dir.FullName
          # 不给输入：账号是空的，setup 必然退 2，脚本要把它变成失败而不是 Done
          $out = '' | cmd /c install.cmd 2>&1 | Out-String
          $code = $LASTEXITCODE
          $out
          if ($out -notmatch 'SHA256 verified') { throw '校验和没跑' }
          if ($out -match 'Done\.') { throw '空账号却报了 Done' }
          if ($code -eq 0) { throw "install.cmd 退 0，应为失败：$code" }
          Pop-Location
