name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: py${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: pytest -q

  keyring:
    name: 钥匙串依赖可装可跑
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev,keyring]"
      - name: keyring 能 import、凭据逻辑能过
        run: |
          python -c "import keyring; print(keyring.get_keyring())"
          pytest -q tests/test_credentials.py

  smoke:
    name: 打包与入口自检
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: 帮助与适配层列表可运行
        run: |
          campus-auth --help
          campus-auth adapters
          campus-auth init -o /tmp/x.toml
          grep -q 'adapter = "huuc"' /tmp/x.toml
          sed -i 's/^account = ""/account = "0814"/' /tmp/x.toml
      - name: 单文件 zipapp 可构建、可运行（与发布同一脚本）
        run: |
          python tools/build_zipapp.py /tmp/campus-auth.pyz
          python /tmp/campus-auth.pyz adapters
      - name: 版本一致性
        run: python tools/check_version.py
      - name: install 产物的转义自检
        run: python tools/check_install_artifacts.py
      - name: install --dry-run 能给出产物
        run: |
          campus-auth install --config /tmp/x.toml --dry-run | tee /tmp/dry.txt
          grep -q 'campus_auth' /tmp/dry.txt

  install:
    # 三平台的 install 命令以前只跑过 dry-run 的字符串检查，真机从没执行过
    name: 自启能装能卸 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: 造一份配置
        shell: bash
        run: |
          printf 'adapter = "huuc"\naccount = "0814"\npassword = "pw"\n' > "$RUNNER_TEMP/c.toml"
      - name: install --dry-run 先给产物
        shell: bash
        run: campus-auth install --config "$RUNNER_TEMP/c.toml" --dry-run | grep -q campus_auth
      - name: 真装
        shell: bash
        run: campus-auth install --config "$RUNNER_TEMP/c.toml"
      - name: 装上了吗
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            reg query 'HKCU\Software\Microsoft\Windows\CurrentVersion\Run' /v campus-auth-watch
            test -f "$APPDATA/campus-auth/campus-auth-watch.cmd"
          else
            launchctl list | grep campus-auth
            test -f "$HOME/Library/LaunchAgents/cn.campus-auth.watch.plist"
          fi
      - name: 卸载后要干净
        shell: bash
        run: |
          campus-auth uninstall --config "$RUNNER_TEMP/c.toml"
          if [ "$RUNNER_OS" = "Windows" ]; then
            ! reg query 'HKCU\Software\Microsoft\Windows\CurrentVersion\Run' /v campus-auth-watch
            test ! -f "$APPDATA/campus-auth/campus-auth-watch.cmd"
          else
            test ! -f "$HOME/Library/LaunchAgents/cn.campus-auth.watch.plist"
          fi
