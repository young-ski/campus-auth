# 复制成 campus-auth.toml 再改。campus-auth.toml 已在 .gitignore 里。
# adapter：huuc 是本仓库示例，你自己的学校照 generic 复制一份再填代号
adapter = "huuc"
account = "081456789"   # 学号，纯数字，别带 @ 后缀
password = ""           # 留空则读 $CAMPUS_AUTH_PASSWORD / 系统钥匙串
operator = "none"       # none / cmcc / unicom / dx，仅 Dr.COM 系有意义

# base_url = "https://10.20.30.1:802"   # 留空用适配层地址
# verify_tls = false    # 校园门户都是自签证书，默认就关着
# timeout = 20
# retries = 2
# mac = ""              # 留空自动探测，取不到会填全 0
# ip = ""               # 离线生成 URL 时可手动指定
# interval = 120        # watch 两轮之间的基准秒数
# probe_host = "www.baidu.com"
