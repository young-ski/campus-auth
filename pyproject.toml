[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "campus-auth"
version = "0.4.0"
description = "Dr.COM / eportal 校园网门户认证客户端，适配层按学校可插拔"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "young-ski" }]
keywords = ["eportal", "drcom", "campus-network", "captive-portal", "cli"]
classifiers = [
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Networking",
]
dependencies = []

[project.optional-dependencies]
keyring = ["keyring>=24"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
campus-auth = "campus_auth.cli:main"

[project.urls]
Homepage = "https://github.com/young-ski/campus-auth"
Issues = "https://github.com/young-ski/campus-auth/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
